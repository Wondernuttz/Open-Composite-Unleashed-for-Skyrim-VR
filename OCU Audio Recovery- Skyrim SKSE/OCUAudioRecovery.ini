[AudioRecovery]
; Safety build: automatic recovery is disabled because Skyrim's synchronous
; XAudio reset can freeze after a Virtual Desktop endpoint disconnect.
bEnabled=0

; Wait until Windows/Virtual Desktop has stopped changing endpoints before
; asking Skyrim to rebuild audio.
iReconnectDelayMs=2500

; Prevent repeated Windows notifications from repeatedly resetting audio.
iMinimumRecoveryIntervalMs=10000

; Extra diagnostic messages in OCUAudioRecovery.log.
bDebugLogging=0
